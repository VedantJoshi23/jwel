# Application stack — the one you redeploy. Joins the same external network as
# the Postgres stack and reaches it by service name (`postgres:5432`).
#
#   docker compose -f docker-compose.api.yml run --rm migrate
#   docker compose -f docker-compose.api.yml up -d

# Pinned so the `uploads` volume is always `jwel_uploads` regardless of what
# the checkout directory is called. Deliberately different from the data
# stack's `jwel-data` — see the comment in docker-compose.postgres.yml.
name: jwel

services:
  api:
    image: ghcr.io/${GH_OWNER}/jwel-api:${API_TAG:?pin a git SHA, never latest}
    restart: unless-stopped
    env_file:
      - ./.env.production
    environment:
      NODE_ENV: production
      PORT: 4000
      # Service-name host: resolves over jwel-net, never leaves the host.
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-jwel}?schema=public
      STORAGE_PROVIDER: filesystem
      UPLOADS_DIR: /app/uploads
    volumes:
      # Without this, every redeploy silently destroys uploaded product images.
      - uploads:/app/uploads
    networks:
      - jwel-net
    # Bound to the loopback interface ONLY. The leading `127.0.0.1:` is not
    # decoration — `4000:4000` would publish the API to the world on port 4000,
    # bypassing nginx's TLS and its /docs block. Docker publishes ports by
    # writing DNAT rules straight into iptables, ahead of ufw, so a bare
    # `4000:4000` is reachable from the internet even with ufw denying 4000.
    ports:
      - "127.0.0.1:4000:4000"
    healthcheck:
      # /health/ready proves Prisma can actually reach Postgres, not merely
      # that the HTTP listener is up — a container with a dead DB pool must not
      # report healthy. See modules/health/health.controller.ts.
      test: ["CMD", "node", "-e", "fetch('http://localhost:4000/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  web:
    image: ghcr.io/${GH_OWNER}/jwel-web:${WEB_TAG:?pin a git SHA, never latest}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: 0.0.0.0
    networks:
      - jwel-net
    # Loopback only — see the note on the api service above.
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - api
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  # One-shot migration runner. Same image, different command — so the schema
  # applied always matches the code being deployed. Run it BEFORE `up -d`.
  # Kept out of the api container's CMD so two replicas can never race.
  migrate:
    image: ghcr.io/${GH_OWNER}/jwel-api:${API_TAG:?pin a git SHA, never latest}
    profiles: ["tools"]
    env_file:
      - ./.env.production
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-jwel}?schema=public
    command: >
      npx prisma migrate deploy --schema=src/prisma/schema.prisma
    networks:
      - jwel-net
    restart: "no"

  # One-shot admin bootstrap. Creates (or promotes, and resets the password of)
  # the account the client uses to manage the catalogue — nothing else in the
  # codebase can produce an ADMIN. Deliberately NOT `prisma db seed`: the seed
  # script resets the catalogue and would orphan every uploaded product image.
  #
  #   ADMIN_EMAIL=… ADMIN_PASSWORD=… docker compose \
  #     -f docker-compose.api.yml run --rm create-admin
  create-admin:
    image: ghcr.io/${GH_OWNER}/jwel-api:${API_TAG:?pin a git SHA, never latest}
    profiles: ["tools"]
    env_file:
      - ./.env.production
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-jwel}?schema=public
      # Plain `:-` rather than `:?`. Compose interpolates and validates the
      # WHOLE file before running any service, so a `:?` here made every other
      # command in this file — including `run --rm migrate` — fail with
      # "required variable ADMIN_PASSWORD is missing" unless the admin vars
      # happened to be set. scripts/create-admin.ts already rejects a missing
      # email or password (and enforces a 12-character minimum), so the guard
      # was redundant as well as blocking.
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      ADMIN_NAME: ${ADMIN_NAME:-Administrator}
    command: npx ts-node --transpile-only scripts/create-admin.ts
    networks:
      - jwel-net
    restart: "no"

  # NOTE: there is no `caddy` service here. This stack assumes the HOST's nginx
  # terminates TLS and reverse-proxies to the loopback ports published above —
  # see nginx/jwel.conf.template and README §6. A containerised Caddy
  # would need ports 80/443, which the host nginx already owns, and the two
  # would fight over the ACME http-01 challenge.
  #
  # If you ever move to a host with no nginx, deploy/Caddyfile still describes
  # the Caddy-as-edge alternative; re-add the service and drop the `ports:`
  # blocks from api and web when you do.

volumes:
  uploads:

networks:
  jwel-net:
    external: true
